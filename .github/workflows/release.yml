name: Release

# Driven by pushing a version tag: tag v0.2.10 -> release v0.2.10.
# The manifest version must match, so a release can never again ship a
# manifest that disagrees with its tag (#78).
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Read and verify the version
        id: version
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, pathlib
          manifest = json.loads(pathlib.Path("custom_components/ha_zyxel/manifest.json").read_text())
          version = manifest["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != f"v{version}":
              raise SystemExit(f"tag {tag} does not match manifest version {version}; bump the manifest before tagging")
          print(f"version={version}")
          print(f"tag={tag}")
          PY

      - name: Build the release body
        id: notes
        run: |
          # A per-release file wins; otherwise use RELEASE_NOTES.md, which is
          # replaced after each release.
          if [ -f "docs/releases/${{ steps.version.outputs.tag }}.md" ]; then
            cp "docs/releases/${{ steps.version.outputs.tag }}.md" release-body.md
          elif [ -f RELEASE_NOTES.md ]; then
            cp RELEASE_NOTES.md release-body.md
          else
            echo "No release notes found" > release-body.md
          fi
          echo "Release body:"; cat release-body.md

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --notes-file release-body.md \
            --verify-tag
